<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">

<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-bT7jrBDMuKiP2ZFp79A9i+sVWV+n+BFgFTykCRfOKUE='; style-src 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>لوحة المراجعة — مسار عُمان | Review dashboard — MASAR OMAN</title>
<style>
:root{--burg:#713849;--copper:#AC7250;--ivory:#FBF7F0;--ink:#2a1d22;--soft:#6b5a60;--line:#e6dbd0;--ok:#1f7a4a;--okbg:#e3f4ea;--warn:#8a5a00;--warnbg:#fff1d6;--bad:#9b1c1c;--badbg:#fde2e2}
*{box-sizing:border-box}body{margin:0;font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;background:var(--ivory);color:var(--ink);line-height:1.6}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 20px;background:#fff;border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:20px;color:var(--burg)}header .sp{flex:1}
button,select,input,textarea{font:inherit}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:7px 14px;cursor:pointer}
.btn.p{background:var(--burg);border-color:var(--burg);color:#fff}.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}.btn.bad{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
main{max-width:1200px;margin:0 auto;padding:20px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.off{background:var(--warnbg);color:var(--warn);border-radius:18px;padding:16px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.tab.on{background:var(--burg);color:#fff;border-color:var(--burg)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--soft);min-width:220px}
.f input,.f select,.f textarea{border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--ink);background:#fff}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}th{font-size:12px;color:var(--soft)}
.st{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700;background:#eee}
.st.pending,.st.new{background:var(--warnbg);color:var(--warn)}.st.approved,.st.fixed{background:var(--okbg);color:var(--ok)}.st.rejected,.st.spam,.st.dismissed{background:var(--badbg);color:var(--bad)}.st.needs_info,.st.in_review{background:#e6eefc;color:#1d4c9b}
pre{white-space:pre-wrap;word-break:break-word;background:#faf6f1;border-radius:12px;padding:10px;font-size:13px;margin:6px 0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}@media(max-width:800px){.grid{grid-template-columns:1fr}}
.msg{min-height:1.4em;font-size:14px;color:var(--soft)}.dup{background:var(--warnbg);color:var(--warn);border-radius:12px;padding:8px 10px;font-size:13px}
a{color:var(--burg)}
</style>
</head>
<body>
<header><h1 data-t="t_title"></h1><span class="sp"></span><button class="btn" id="lang" type="button">EN</button><button class="btn" id="out" type="button" hidden></button></header>
<main id="app"></main>
<script id="mo-admin">
(function () {
  'use strict';
  var T = {
    t_title: ['لوحة مراجعة مسار عُمان', 'Masar Oman review dashboard'],
    off_t: ['اللوحة غير مفعّلة بعد', 'The dashboard is not connected yet'],
    off_p: ['لم تُربط قاعدة بيانات Supabase بعد، لذلك لا يمكن تسجيل الدخول أو عرض أي طلب. بعد تشغيل ملف SQL وإرسال رابط المشروع والمفتاح العام (anon) تعمل اللوحة مباشرة.', 'No Supabase project is connected yet, so nobody can sign in and no request can be shown. Once the SQL file is run and the project URL and public (anon) key are provided, the dashboard works straight away.'],
    login: ['تسجيل دخول المراجع', 'Reviewer sign-in'], email: ['البريد الإلكتروني', 'E-mail'], pass: ['كلمة المرور', 'Password'], signin: ['دخول', 'Sign in'], signout: ['خروج', 'Sign out'],
    bad_login: ['تعذّر الدخول. تحقق من البيانات.', 'Sign-in failed. Check your details.'], not_rev: ['هذا الحساب ليس ضمن المراجعين.', 'This account is not a reviewer.'],
    apps: ['طلبات الجهات', 'Business applications'], reps: ['بلاغات الزوار', 'Visitor reports'], rv: ['طلبات الكرفانات', 'Caravan submissions'], lists: ['المنشور', 'Published'],
    pending: ['بانتظار المراجعة', 'Pending'], needs_info: ['بحاجة لمعلومات', 'Needs info'], approved: ['معتمد', 'Approved'], rejected: ['مرفوض', 'Rejected'], spam: ['مزعج', 'Spam'], new: ['جديد', 'New'], in_review: ['قيد المراجعة', 'In review'], fixed: ['صُحّح', 'Fixed'], dismissed: ['لا يلزم', 'Dismissed'],
    none: ['لا توجد عناصر.', 'Nothing here.'], open: ['فتح', 'Open'], file: ['فتح وثيقة الترخيص (رابط مؤقت 5 دقائق)', 'Open licence document (5-minute link)'], note: ['ملاحظة المراجع', 'Reviewer note'],
    lic_ok: ['تحققت من الترخيص مع الجهة المصدرة', 'I verified the licence with the issuing body'], show_no: ['اعرض رقم الترخيص (إن سمح صاحبه)', 'Show licence number (if the applicant allowed it)'],
    approve: ['اعتماد ونشر البيانات العامة', 'Approve and publish public details'], ask: ['طلب معلومات', 'Ask for info'], reject: ['رفض', 'Reject'], mark_spam: ['مزعج', 'Spam'],
    hide: ['إخفاء (بيانات قديمة)', 'Hide (outdated)'], unhide: ['إظهار', 'Show'], done: ['تم.', 'Done.'], err: ['حدث خطأ: ', 'Error: '],
    pub: ['البيانات العامة', 'Public details'], priv: ['بيانات التواصل الخاصة (لا تُنشر)', 'Private contact (never published)'], lic: ['الترخيص', 'Licence'],
    dup: ['تنبيه تكرار: يوجد اسم مطابق منشور بالفعل:', 'Duplicate warning: a matching name is already published:'], set: ['تعيين الحالة', 'Set status']
  };
  var L = 'ar'; try { L = localStorage.getItem('masar-lang') === 'en' ? 'en' : 'ar'; } catch (e) {}
  function t(k) { var v = T[k]; return v ? v[L === 'en' ? 1 : 0] : k; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  var meta = document.querySelector('meta[name="mo-backend"]'), B = null;
  if (meta) { var p = (meta.getAttribute('content') || '').split('|'); if (/^https:\/\/[a-z0-9]{20}\.supabase\.co$/.test(p[0]) && p[1]) B = { url: p[0], key: p[1] }; }
  var S = { tok: null, tab: 'apps', filter: 'pending', items: [], listings: [], open: null, msg: '' };
  try { S.tok = sessionStorage.getItem('mo-admin-tok'); } catch (e) {}
  var app = document.getElementById('app');
  function H(json) { var h = { apikey: B.key }; if (S.tok) h.Authorization = 'Bearer ' + S.tok; else if (/^eyJ/.test(B.key)) h.Authorization = 'Bearer ' + B.key; if (json) h['Content-Type'] = 'application/json'; return h; }
  function api(path, opt) { return fetch(B.url + path, Object.assign({ headers: H(opt && opt.body) }, opt || {})).then(function (r) { if (r.status === 401) { logout(); throw new Error('401'); } return r.text().then(function (x) { if (!r.ok) throw new Error(x.slice(0, 200) || r.status); return x ? JSON.parse(x) : null; }); }); }
  function rpc(fn, args) { return api('/rest/v1/rpc/' + fn, { method: 'POST', body: JSON.stringify(args) }); }
  function logout() { S.tok = null; try { sessionStorage.removeItem('mo-admin-tok'); } catch (e) {} draw(); }
  function chrome() { document.documentElement.lang = L; document.documentElement.dir = L === 'en' ? 'ltr' : 'rtl'; document.querySelectorAll('[data-t]').forEach(function (e) { e.textContent = t(e.getAttribute('data-t')); }); document.getElementById('lang').textContent = L === 'en' ? 'ع' : 'EN'; var o = document.getElementById('out'); o.hidden = !S.tok; o.textContent = t('signout'); }
  function draw() {
    chrome();
    if (!B) { app.innerHTML = '<div class="off" data-admin-off><b>' + esc(t('off_t')) + '</b><p>' + esc(t('off_p')) + '</p></div>'; return; }
    if (!S.tok) { app.innerHTML = '<form class="card" id="login" style="max-width:420px"><h2>' + esc(t('login')) + '</h2><label class="f">' + esc(t('email')) + '<input name="e" type="email" required autocomplete="username"></label><label class="f">' + esc(t('pass')) + '<input name="p" type="password" required autocomplete="current-password"></label><p><button class="btn p" type="submit">' + esc(t('signin')) + '</button></p><p class="msg">' + esc(S.msg) + '</p></form>'; return; }
    var tabs = [['apps', t('apps')], ['reps', t('reps')], ['rv', t('rv')], ['lists', t('lists')]];
    var st = S.tab === 'apps' ? ['pending', 'needs_info', 'approved', 'rejected', 'spam'] : S.tab === 'reps' ? ['new', 'in_review', 'fixed', 'dismissed', 'spam'] : S.tab === 'rv' ? ['pending', 'approved', 'rejected', 'spam'] : [];
    var h = '<div class="tabs">' + tabs.map(function (x) { return '<button class="btn tab' + (S.tab === x[0] ? ' on' : '') + '" data-tab="' + x[0] + '" type="button">' + esc(x[1]) + '</button>'; }).join('') + '</div>';
    if (st.length) h += '<div class="tabs">' + st.map(function (x) { return '<button class="btn' + (S.filter === x ? ' tab on' : '') + '" data-filter="' + x + '" type="button">' + esc(t(x)) + '</button>'; }).join('') + '</div>';
    h += '<p class="msg" id="msg">' + esc(S.msg) + '</p><div class="card"><table><thead><tr><th>Ref</th><th>' + esc(S.tab === 'reps' ? 'Page' : 'Name') + '</th><th>Type</th><th>Status</th><th>Date</th><th></th></tr></thead><tbody>';
    var rows = S.items;
    if (!rows.length) h += '<tr><td colspan="6">' + esc(t('none')) + '</td></tr>';
    rows.forEach(function (r) {
      var name = S.tab === 'apps' ? (r.public_data && (r.public_data.name_ar + ' / ' + r.public_data.name_en)) : S.tab === 'reps' ? r.page : S.tab === 'rv' ? (r.data && (r.data.biz || r.site_id)) : (r.public_data && (r.public_data.name_ar + ' / ' + r.public_data.name_en));
      var stt = S.tab === 'lists' ? (r.hidden ? 'dismissed' : 'approved') : r.status;
      h += '<tr><td dir="ltr">' + esc(r.ref || r.application_ref) + '</td><td>' + esc(name) + '</td><td>' + esc(r.kind || '') + '</td><td><span class="st ' + esc(stt) + '">' + esc(S.tab === 'lists' ? (r.hidden ? t('hide') : t('approved')) : t(r.status)) + '</span></td><td dir="ltr">' + esc(String(r.created_at || r.published_at || '').slice(0, 10)) + '</td><td><button class="btn" type="button" data-open="' + esc(r.ref || r.application_ref) + '">' + esc(t('open')) + '</button></td></tr>';
      if (S.open === (r.ref || r.application_ref)) h += '<tr><td colspan="6">' + detail(r) + '</td></tr>';
    });
    h += '</tbody></table></div>';
    app.innerHTML = h;
  }
  function kv(o) { return '<pre dir="auto">' + esc(JSON.stringify(o || {}, null, 2)) + '</pre>'; }
  function detail(r) {
    if (S.tab === 'apps') {
      var name = ((r.public_data || {}).name_en || '').toLowerCase(), dup = S.listings.filter(function (l) { return name && ((l.public_data || {}).name_en || '').toLowerCase() === name; });
      return (dup.length ? '<p class="dup">' + esc(t('dup')) + ' ' + esc(dup.map(function (d) { return d.application_ref; }).join(', ')) + '</p>' : '') +
        '<div class="grid"><div><h3>' + esc(t('pub')) + '</h3>' + kv(r.public_data) + '</div><div><h3>' + esc(t('priv')) + '</h3>' + kv(r.private_data) + '<h3>' + esc(t('lic')) + '</h3>' + kv(r.licence) +
        (r.files || []).map(function (f) { return '<p><button class="btn" type="button" data-file="' + esc(f) + '" data-bucket="mo-licences">' + esc(t('file')) + '</button></p>'; }).join('') + '</div></div>' +
        (r.status !== 'approved' ? '<label class="f">' + esc(t('note')) + '<textarea id="note" rows="2" maxlength="500">' + esc(r.reviewer_note || '') + '</textarea></label><p class="row"><label><input type="checkbox" id="licok"> ' + esc(t('lic_ok')) + '</label> <label><input type="checkbox" id="showno"> ' + esc(t('show_no')) + '</label></p>' +
        '<p class="row"><button class="btn ok" type="button" data-act="approve" data-ref="' + esc(r.ref) + '">' + esc(t('approve')) + '</button><button class="btn" type="button" data-act="needs_info" data-ref="' + esc(r.ref) + '">' + esc(t('ask')) + '</button><button class="btn bad" type="button" data-act="rejected" data-ref="' + esc(r.ref) + '">' + esc(t('reject')) + '</button><button class="btn bad" type="button" data-act="spam" data-ref="' + esc(r.ref) + '">' + esc(t('mark_spam')) + '</button></p>' : '<p>' + esc(r.reviewer_note || '') + '</p>');
    }
    if (S.tab === 'reps') return kv({ page: r.page, message: r.message, contact: r.contact, note: r.reviewer_note }) + '<label class="f">' + esc(t('note')) + '<textarea id="note" rows="2" maxlength="500">' + esc(r.reviewer_note || '') + '</textarea></label><p class="row">' + ['in_review', 'fixed', 'dismissed', 'spam'].map(function (s) { return '<button class="btn" type="button" data-rep="' + s + '" data-ref="' + esc(r.ref) + '">' + esc(t(s)) + '</button>'; }).join('') + '</p>';
    if (S.tab === 'rv') return kv(r.data) + (r.files || []).map(function (f) { return '<p><button class="btn" type="button" data-file="' + esc(f) + '" data-bucket="rv-submissions">' + esc(t('file')) + '</button></p>'; }).join('') + '<label class="f">' + esc(t('note')) + '<textarea id="note" rows="2" maxlength="500">' + esc(r.reviewer_note || '') + '</textarea></label><p class="row">' + ['approved', 'rejected', 'spam', 'pending'].map(function (s) { return '<button class="btn" type="button" data-rv="' + s + '" data-ref="' + esc(r.ref) + '">' + esc(t(s)) + '</button>'; }).join('') + '</p>';
    return kv(r) + '<p><button class="btn" type="button" data-hide="' + (r.hidden ? '0' : '1') + '" data-ref="' + esc(r.application_ref) + '">' + esc(r.hidden ? t('unhide') : t('hide')) + '</button></p>';
  }
  function load() {
    if (!B || !S.tok) return draw();
    var q = S.tab === 'apps' ? '/rest/v1/mo_applications?select=*&status=eq.' + S.filter + '&order=created_at.desc&limit=200'
      : S.tab === 'reps' ? '/rest/v1/mo_reports?select=*&status=eq.' + S.filter + '&order=created_at.desc&limit=200'
      : S.tab === 'rv' ? '/rest/v1/rv_submissions?select=*&status=eq.' + S.filter + '&order=created_at.desc&limit=200'
      : '/rest/v1/mo_listings?select=*&order=published_at.desc&limit=500';
    Promise.all([api(q), api('/rest/v1/mo_listings?select=application_ref,public_data,hidden&limit=1000')]).then(function (x) { S.items = x[0] || []; S.listings = x[1] || []; draw(); }).catch(function (e) { S.msg = t('err') + e.message; draw(); });
  }
  document.addEventListener('submit', function (e) {
    if (e.target.id !== 'login') return; e.preventDefault();
    var f = e.target;
    fetch(B.url + '/auth/v1/token?grant_type=password', { method: 'POST', headers: { apikey: B.key, 'Content-Type': 'application/json' }, body: JSON.stringify({ email: f.e.value, password: f.p.value }) })
      .then(function (r) { if (!r.ok) throw 0; return r.json(); }).then(function (j) {
        S.tok = j.access_token; return rpc('mo_is_reviewer', {}).then(function (ok) { if (ok !== true) { S.tok = null; S.msg = t('not_rev'); return draw(); } try { sessionStorage.setItem('mo-admin-tok', S.tok); } catch (e) {} S.msg = ''; load(); });
      }).catch(function () { S.tok = null; S.msg = t('bad_login'); draw(); });
  });
  document.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.id === 'lang') { L = L === 'en' ? 'ar' : 'en'; return draw(); }
    if (b.id === 'out') return logout();
    if (b.dataset.tab) { S.tab = b.dataset.tab; S.filter = b.dataset.tab === 'reps' ? 'new' : 'pending'; S.open = null; return load(); }
    if (b.dataset.filter) { S.filter = b.dataset.filter; S.open = null; return load(); }
    if (b.dataset.open) { S.open = S.open === b.dataset.open ? null : b.dataset.open; return draw(); }
    var note = (document.getElementById('note') || {}).value || '', done = function () { S.msg = t('done'); S.open = null; load(); }, fail = function (er) { S.msg = t('err') + er.message; draw(); };
    if (b.dataset.file) { api('/storage/v1/object/sign/' + b.dataset.bucket + '/' + b.dataset.file.split('/').map(encodeURIComponent).join('/'), { method: 'POST', body: JSON.stringify({ expiresIn: 300 }) }).then(function (j) { var u = j && (j.signedURL || j.signedUrl); if (u) window.open(B.url + '/storage/v1' + u, '_blank', 'noopener'); }).catch(fail); return; }
    if (b.dataset.act === 'approve') { b.disabled = true; return rpc('mo_approve', { p_ref: b.dataset.ref, p_licence_verified: document.getElementById('licok').checked, p_show_number: document.getElementById('showno').checked, p_note: note }).then(done, fail); }
    if (b.dataset.act) { b.disabled = true; return rpc('mo_set_status', { p_ref: b.dataset.ref, p_status: b.dataset.act, p_note: note }).then(done, fail); }
    if (b.dataset.rep) return rpc('mo_handle_report', { p_ref: b.dataset.ref, p_status: b.dataset.rep, p_note: note }).then(done, fail);
    if (b.dataset.rv) return rpc('rv_set_status', { p_ref: b.dataset.ref, p_status: b.dataset.rv, p_note: note }).then(done, fail);
    if (b.dataset.hide) return rpc('mo_set_listing_hidden', { p_ref: b.dataset.ref, p_hidden: b.dataset.hide === '1' }).then(done, fail);
  });
  if (S.tok) load(); else draw();
})();
</script>
</body>
</html>
